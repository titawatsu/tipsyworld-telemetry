name: Dispatch account Pages leaderboard deployment
on:
  push:
    branches: [main]
    paths: [leaderboard.json]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the account Pages workflow
        env:
          GH_TOKEN: ${{ secrets.TIPSYWORLD_PAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set TIPSYWORLD_PAGES_DISPATCH_TOKEN, or dispatch deploy-leaderboard.yml manually in titawatsu.github.io."
            exit 1
          fi
          gh api --method POST \
            repos/titawatsu/titawatsu.github.io/actions/workflows/deploy-leaderboard.yml/dispatches \
            -f ref=main
